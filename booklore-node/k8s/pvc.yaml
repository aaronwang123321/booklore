apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-storage-pvc
  namespace: booklore
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-uploads-pvc
  namespace: booklore
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd