apiVersion: v1
kind: ConfigMap
metadata:
  name: booklore-config
  namespace: booklore
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://booklore.com"
  JWT_EXPIRES_IN: "15m"
  MAX_FILE_SIZE: "100MB"
  FILE_STORAGE_PATH: "/app/storage"
  REDIS_URL: "redis://booklore-redis:6379"